<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        body {
            background-color: light Blue;
            font-family: Arial;
        }

        .login-box {
            background-color: Dark Blue ;
            width: 300px;
            padding: 30px;
            margin: 100px auto;
            border-radius: 10px;
            text-align: center;
        }

        h2 {
            color: black ;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            background-color: Blue;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: blue;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Facebook</h2>

        <form>
            <input type="text"
                   placeholder="Enter Username">

            <input type="password"
                   placeholder="Enter Password">

          <input type="Email"
                   placeholder="Enter Email">


        <input type="Phone number"
                   placeholder="Enter Phone number">

      <input type="Gender"
                   placeholder="Enter Gender">
      
       <input type="date"
       placeholder="Enter Date of birth">
      

        
            <br><br>

            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
