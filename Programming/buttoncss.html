<!DOCTYPE html>
<html>
<head>
    <title>CSS Button</title>

    <style>
        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: green;
        }
    </style>

</head>
<body>

    <button>Click Me</button>

</body>
</html>
